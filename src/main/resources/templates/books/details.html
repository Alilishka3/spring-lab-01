<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}">Book</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <h1 th:text="${book.title}">Title</h1>
    <p><b th:text="${book.author}">Author</b>, <span th:text="${book.year}">2020</span></p>
    <p>Genre: <span th:text="${book.genre}">NOVEL</span> · ISBN: <span th:text="${book.isbn} ?: '—'">978…</span></p>
    <p><a th:href="@{/books}">← Back to the catalogue</a></p>
</main>
</body>
</html>
