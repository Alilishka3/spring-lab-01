spring:
  application:
    name: spring-lab
  messages:
    basename: messages
    fallback-to-system-locale: false   # en -> messages.properties, not the OS locale (ru)
server:
  port: 8080
app:
  owner: Altai Ali
  group: IT1-2409IS
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  date-pattern: yyyy-MM-dd HH:mm:ss
  pagination:
    default-size: 20
    max-size: 100
logging:
  level:
    kz.iitu: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: ALWAYS
    configprops:
      show-values: ALWAYS